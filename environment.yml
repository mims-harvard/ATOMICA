# ATOMICA conda environment.
#
#   mamba env create -f environment.yml
#   mamba activate atomica-env
#   pip install -e ".[dev]"
#
# PyTorch is installed from the pip wheel index rather than the pytorch conda
# channel: the pip index covers CUDA 11.8 through 13.0, and each wheel bundles
# its own CUDA runtime, so no CUDA toolkit is needed on the host. Change the
# --index-url below to match your NVIDIA driver (`nvidia-smi`); setup/README.md
# has the driver-to-CUDA table.
#
#   CUDA 13.0  https://download.pytorch.org/whl/cu130
#   CUDA 12.8  https://download.pytorch.org/whl/cu128
#   CUDA 11.8  https://download.pytorch.org/whl/cu118
#   CPU only   https://download.pytorch.org/whl/cpu

name: atomica-env
channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip

  # Everything else, including PyTorch, is resolved by pip from pyproject.toml.
  # torch-scatter and torch-cluster are deliberately absent: ATOMICA does not
  # need them (see setup/README.md, "Optional compiled extensions").
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch
      - -e .[dev]
